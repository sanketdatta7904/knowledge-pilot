[project]
name = "slope-mvp"
version = "0.1.0"
description = "Math textbook → competency hierarchy MVP"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2.0",
    "pymupdf",
    "openpyxl",
    "networkx",
    "python-dotenv",
]

[project.scripts]
slope-mvp = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
